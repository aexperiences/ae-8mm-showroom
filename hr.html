<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HR · People Ops · 8mm OS</title><link rel="icon" href="https://www.aexperiences.com/8mm_OS.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="eightmm.css"></head><body>
<script src="eightmm.js"></script>
<script>
(function () {
  var E = window.EightMM, c = E.mount({ active:"hr.html", crumb:"HR · People Ops" }), d = E.db();
  function verdictCard(key){ var r=E.consult(key); if(!r) return null; var v=r.verdict,p=r.passed,dp=r.dept;
    return E.card('<div class="between"><div><h2>'+E.esc(dp.name)+' · the org\'s read</h2><div class="card-sub">'+E.esc(dp.dh.line)+'</div></div><div>'+E.tag((p?"released":"held")+" · "+v.conf+"%",p?"good":"watch")+'</div></div><div class="fence'+(p?'':' crim')+'">'+E.esc(v.stance)+'</div><div class="conf"><span class="muted small">bar '+dp.gate+'%</span><span class="conf-bar"><i class="conf-fill '+(p?'':'under')+'" style="width:'+v.conf+'%"></i><span class="conf-gate" style="left:'+dp.gate+'%"></span></span><span class="conf-n">'+v.conf+'%</span></div><ul class="reasons">'+v.reasons.map(function(x){return '<li><span class="rtag '+x.t+'">'+x.t.toUpperCase()+'</span><span>'+E.esc(x.s)+'</span></li>';}).join("")+'</ul>'); }
  c.appendChild(E.page("HR · People Ops","The core team and the AI seats side by side — deal memos, onboarding, union status. A boutique studio is a handful of principals plus a freelance bench."));
  c.appendChild(E.card('<h2>The studio</h2><table><thead><tr><th>Name</th><th>Role</th><th>Type</th><th>Dept</th><th>Note</th></tr></thead><tbody>'+
    d.team.map(function(t){var typ=t.type.indexOf("AI")>=0?"gold":"ghost";return '<tr><td class="t-main">'+E.esc(t.name)+'</td><td>'+E.esc(t.role)+'</td><td>'+E.tag(t.type,typ)+'</td><td class="small">'+E.esc(t.dept)+'</td><td class="t-sub">'+E.esc(t.note)+'</td></tr>';}).join("")+'</tbody></table>'));
  var vc=verdictCard("hr"); if(vc) c.appendChild(vc);
})();
</script></body></html>
