<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IT · System Health · 8mm OS</title><link rel="icon" href="https://www.aexperiences.com/8mm_OS.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="eightmm.css"></head><body>
<script src="eightmm.js"></script>
<script>
(function () {
  var E = window.EightMM, c = E.mount({ active:"it.html", crumb:"IT · System Health" }), d = E.db();
  function verdictCard(key){ var r=E.consult(key); if(!r) return null; var v=r.verdict,p=r.passed,dp=r.dept;
    return E.card('<div class="between"><div><h2>'+E.esc(dp.name)+' · the org\'s read</h2><div class="card-sub">'+E.esc(dp.dh.line)+'</div></div><div>'+E.tag((p?"released":"held")+" · "+v.conf+"%",p?"good":"watch")+'</div></div><div class="fence'+(p?'':' crim')+'">'+E.esc(v.stance)+'</div><div class="conf"><span class="muted small">bar '+dp.gate+'%</span><span class="conf-bar"><i class="conf-fill '+(p?'':'under')+'" style="width:'+v.conf+'%"></i><span class="conf-gate" style="left:'+dp.gate+'%"></span></span><span class="conf-n">'+v.conf+'%</span></div><ul class="reasons">'+v.reasons.map(function(x){return '<li><span class="rtag '+x.t+'">'+x.t.toUpperCase()+'</span><span>'+E.esc(x.s)+'</span></li>';}).join("")+'</ul>'); }
  c.appendChild(E.page("IT · System Health","CLEAR / WATCH / INTERVENE on the media store, the delivery vault, the review portal and the backups. For a studio, lost footage is the outage that ends a relationship — so the backup is verified, not assumed."));
  c.appendChild(E.card('<h2>Services</h2><table><thead><tr><th>Service</th><th>State</th><th>Metric</th></tr></thead><tbody>'+
    d.systems.map(function(s){var k=s.state==="CLEAR"?"good":(s.state==="WATCH"?"watch":"bad");return '<tr><td class="t-main">'+E.esc(s.name)+'</td><td>'+E.tag(s.state,k)+'</td><td class="small muted">'+E.esc(s.metric)+'</td></tr>';}).join("")+'</tbody></table>'));
  var vc=verdictCard("it"); if(vc) c.appendChild(vc);
})();
</script></body></html>
